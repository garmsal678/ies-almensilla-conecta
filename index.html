<!DOCTYPE html>
<html lang="es">

<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>IES Almensilla CONECTA</title>

  <!-- Icono específico para iPhone/iPad -->
  <link
  rel="apple-touch-icon"
  sizes="180x180"
  href="conecta-apple-touch-icon-180.png"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="CONECTA"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      background:
        linear-gradient(
          145deg,
          #003f25,
          #00693a
        );

      color:#ffffff;
    }

    .contenedor{
      width:min(420px,100%);
      text-align:center;
    }

    .logo{
      width:150px;
      height:150px;

      margin:0 auto 24px;

      border-radius:34px;

      display:block;

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.25);
    }

    h1{
      margin:0;

      font-size:30px;
      font-weight:900;
    }

    p{
      margin:10px 0 24px;

      font-size:15px;
      line-height:1.45;

      opacity:.88;
    }

    .boton{
      width:100%;

      min-height:52px;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:13px 18px;

      border:1px solid
        rgba(255,255,255,.30);

      border-radius:15px;

      background:#ffffff;

      color:#065c35;

      text-decoration:none;

      font-size:16px;
      font-weight:800;

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.18);
    }

    .nota{
      margin-top:18px;

      font-size:12px;

      opacity:.70;
    }

  </style>

</head>


<body>

  <main class="contenedor">

    <img
      class="logo"
      src="https://raw.githubusercontent.com/garmsal678/ies-almensilla-conecta/main/conecta-icon-512.png"
      alt="CONECTA"
    >

    <h1>
      IES Almensilla CONECTA
    </h1>

    <p>
      Portal de aplicaciones del IES Almensilla
    </p>

    <a
      class="boton"
      href="https://script.google.com/a/macros/g.educaand.es/s/AKfycbzOcun3bxs-1LIIxOCDkBbN3b5Gh61bju4dWenzvBDw2dbVu5gYnRmdtrKi1O2ckDKJ/exec"
    >
      Entrar en CONECTA →
    </a>

    <div class="nota">
      Acceso optimizado para iPhone
    </div>

  </main>

</body>

</html>
